name: Backend CI

on: 
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write
  
jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish ./EventMarketplace/EventMarketplace.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-published
          path: ./publish

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/event-marketplace/eventmarketplace-be:latest -f EventMarketplace/Dockerfile .

      - name: Push Docker image
        run: docker push ghcr.io/event-marketplace/eventmarketplace-be:latest
