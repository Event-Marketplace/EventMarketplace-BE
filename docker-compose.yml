version: '3.9'

services:
  backend:
    image: ghcr.io/event-marketplace/eventmarketplace-be:latest
    build:
      context: .
      dockerfile: EventMarketplace/Dockerfile
    container_name: eventmarketplace-be
    env_file:
      - .env.docker
    ports:
      - "5100:8080"
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
    environment:
      ConnectionStrings_DefaultConnection: "Host=db;Port=${DB_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=${DEFAULT_PROTOCOL};AccountName=${ACCOUNT_NAME};AccountKey=${ACCOUNT_KEY};EndpointSuffix=${ENDPOINT_SUFFIX}"
    depends_on:
      - db

  frontend:
    image: ghcr.io/event-marketplace/eventmarketplace-fe:dev
    build:
      context: ../../Frontend/eventmarketplace
      dockerfile: Dockerfile
    container_name: eventmarketplace-fe
    env_file:
      - ../../Frontend/eventmarketplace/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  dpkeys:
