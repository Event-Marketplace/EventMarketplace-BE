services:
  eventmarketplace:
    image: eventmarketplace
    build:
      context: .
      dockerfile: EventMarketplace/Dockerfile
    ports:
      - "5100:8080"
      - "5101:8081"
    depends_on:
      - db
    environment:
      ConnectionStrings_DefaultConnection: "Host=db;Port=${DB_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
        
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
volumes:
  pgdata: